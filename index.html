:root{--page:#000;--surface:#0f0f0f;--surface2:#161616;--border:#2a2a2a;--border-strong:#454545;
--text:#f5f5f5;--text2:#c9c9c9;--text3:#9e9e9e;--up:#3ddc84;--down:#ff7a7a;--c1:#3d8bfd;--c2:#ff8a3d;
--body:"Manrope","Helvetica Neue",Arial,sans-serif;--mono:"SF Mono",ui-monospace,Menlo,monospace;
--st:calc(var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px));
--sbm:var(--tg-safe-area-inset-bottom,env(safe-area-inset-bottom,0px));
--tabh:calc(60px + var(--sbm));--mbh:0px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--page);color:var(--text);font:14px/1.35 var(--body);-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{overflow:hidden;user-select:none;-webkit-user-select:none}
input{user-select:text;-webkit-user-select:text}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
svg{display:block}
#app{position:fixed;inset:0;max-width:520px;margin:0 auto}
/* шапка */
.hdr{position:absolute;left:0;right:0;top:0;padding:calc(var(--st) + 8px) 14px 8px;display:flex;align-items:center;gap:10px;background:var(--page);z-index:5}
.hdr .lg{width:20px;height:20px}
.hdr h1{font:800 21px/1 var(--body);letter-spacing:-.02em;flex:1;white-space:nowrap}
.hdr .live{display:inline-flex;align-items:center;gap:7px;font:700 11px/1 var(--body);letter-spacing:.06em;color:var(--text2);padding:6px 9px;border:1px solid var(--border-strong);white-space:nowrap}
.hdr .live:before{content:"";width:6px;height:6px;background:var(--up);border-radius:50%;animation:bl 1.6s infinite}
@keyframes bl{50%{opacity:.25}}
.view{position:absolute;left:0;right:0;top:calc(var(--st) + 46px);bottom:calc(var(--tabh) + var(--mbh));overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 20px;display:none}
.view.on{display:block}
/* вкладки */
.tabs{position:absolute;left:0;right:0;bottom:0;height:var(--tabh);padding:7px 6px var(--sbm);border-top:1px solid var(--border);background:#0a0a0a;display:grid;grid-template-columns:repeat(4,1fr);z-index:6}
.tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--text3);font:600 11px/1 var(--body);min-height:44px}
.tab svg{width:23px;height:23px}
.tab.on{color:#fff}
.tab .bd{position:relative}
.tab .bd em{position:absolute;right:-10px;top:-5px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--up);color:#000;font:800 10px/17px var(--body);text-align:center;font-style:normal}
/* общие */
.chips{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 11px;border:1px solid var(--border-strong);font:600 12.5px/1 var(--body);color:var(--text2);white-space:nowrap}
.chip svg{width:14px;height:14px}
.chip.w{background:#fff;color:#000;border-color:#fff}
.chip.on{border-color:#fff;color:#fff}
.chip.off{opacity:.45}
.cut{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.demo{display:flex;align-items:center;gap:8px;padding:8px 10px;margin-bottom:10px;border:1px dashed rgba(255,255,255,.35);font:600 12px/1.3 var(--body);color:var(--text3)}
.spi{display:inline-flex;width:17px;height:17px;flex:none}.spi svg{width:100%;height:100%}
.ini{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.empty{padding:40px 20px;text-align:center;color:var(--text3)}
/* карточка в ленте */
.arb{position:relative;display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);padding:10px 11px;margin-bottom:7px;transition:background-color 1s}
.arb.new{background:#1c2a20}
.arb:active{background:var(--surface2)}
.a1{display:flex;align-items:center;gap:8px}
.ev{flex:1;min-width:0;font:700 14px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr{font:700 17px/1 var(--mono);color:var(--up);letter-spacing:-.02em;transition:color .4s}
.pr.dn{color:var(--down)}
.a2{display:flex;justify-content:space-between;gap:8px;margin:5px 0 7px 25px;font-size:12px;color:var(--text3)}
.a2 .sc{color:var(--text2);font-family:var(--mono);font-size:11.5px;white-space:nowrap}
.a2 .lgn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legs{display:grid;gap:4px;margin-left:25px}
.leg{display:flex;align-items:center;gap:6px;min-width:0;font-size:12.5px;color:var(--text2);border-left:2px solid var(--c);padding-left:7px}
.leg .bk{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.leg .t{margin-left:auto;font:600 11px/1 var(--mono);color:var(--text3);white-space:nowrap}
.leg .k{width:42px;text-align:right;font:700 13px/1 var(--mono);color:var(--text)}
.k.up{color:var(--up)!important}.k.dn{color:var(--down)!important}
/* шторки */
.dim{position:fixed;inset:0;background:rgba(0,0,0,.62);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.dim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;max-height:calc(100% - var(--st) - 30px);background:#0c0c0c;border-top:1px solid var(--border-strong);border-radius:18px 18px 0 0;transform:translateY(105%);transition:transform .26s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#444;margin:8px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:4px 14px 8px;flex:none}
.sheet .sh h3{font:800 18px/1.2 var(--body)}

  var res='<div class="calcres" id="cres">'+resHtml(k,okk,r)+'</div>';
  if(!v.querySelector('.kin')){v.innerHTML=head+'<div class="lbl">Сумма и округление</div><div id="cblk"></div>'+res+'<p class="hint">Нажмите «В калькулятор» в карточке вилки, чтобы перенести её сюда. Сумма и округление общие для всех вилок.</p>'}

  if(keep){var t=document.createElement('div');t.innerHTML=tmp;var c=blk.querySelector('.calc');c.querySelectorAll('.st,.tot,.seg').forEach(function(n){n.remove()});
    var row=c.querySelector('.row2');var sg=t.querySelector('.seg');if(sg)row.appendChild(sg);t.querySelectorAll('.st,.tot').forEach(function(n){c.appendChild(n)})}
  else blk.innerHTML=tmp;

  else if(t.dataset.in==='sum'){var v=parseFloat(t.value.replace(',','.'));if(v>0&&v<1e7){CALC.sum=v;save('calc',CALC);renderCalc()}}});

function ruleCount(r){return live.filter(function(x){return r.sp.indexOf(x.sp)>=0&&roi(x.k)>=r.min}).length}
function hist(r){var s=r.id*13+r.min*7,a=[];for(var i=0;i<12;i++){s=(s*9301+49297)%233280;a.push(Math.round(s/233280*(r.min>=5?3:8)))}return a}

   return '<div class="rule cut'+(r.on?' on':'')+'"><div class="rt"><span>'+esc(r.name)+'</span><button class="sw'+(r.on?' on':'')+'" data-sw="'+r.id+'" aria-label="Вкл/выкл"></button></div>'+

   '<button class="add" data-new="1">'+I.plus+'Новое условие</button>'+
   '<div class="grp"><div class="li">'+I.moon+'<span class="l">Тихие часы<small>'+QUIET.from+'–'+QUIET.to+', без звука</small></span><button class="sw'+(QUIET.on?' on':'')+'" data-q="1"></button></div>'+
   '<button class="li" data-test="1">'+I.chat+'<span class="l">Как выглядит сигнал<small>пример сообщения от бота</small></span><span class="v">'+I.right+'</span></button></div>';
}

function editRule(r){
  var isNew=!r; var d=r?JSON.parse(JSON.stringify(r)):{id:Date.now(),name:'',sp:['tn','bb'],min:3,dur:2,on:true};
  var el=openSheet('rule',isNew?'Новое условие':'Условие','<div id="rb"></div>');
  function draw(){var ae=document.activeElement;var nm=$('#rn')?$('#rn').value:d.name;
   $('#rb').innerHTML='<div class="lbl" style="margin-top:4px">Название</div><input class="inp" id="rn" placeholder="Например, теннис от 3%" value="'+esc(nm)+'">'+
   '<div class="lbl">Виды спорта</div><div class="chips" style="flex-wrap:wrap">'+SPORTS.map(function(x){return '<button class="chip '+(d.sp.indexOf(x)>=0?'on':'off')+'" data-sp="'+x+'">'+sp(x,14)+SPN[x]+'</button>'}).join('')+'</div>'+
   '<div class="lbl">Прибыль от</div><div class="seg" style="width:100%;display:grid;grid-template-columns:repeat(5,1fr)">'+[2,2.5,3,4,5].map(function(m){return '<button data-min="'+m+'" class="'+(d.min==m?'on':'')+'">'+m+'%</button>'}).join('')+'</div>'+
   '<div class="lbl">Вилка живёт от</div><div class="seg" style="width:100%;display:grid;grid-template-columns:repeat(4,1fr)">'+[1,2,3,5].map(function(m){return '<button data-dur="'+m+'" class="'+(d.dur==m?'on':'')+'">'+m+' с</button>'}).join('')+'</div>'+
   '<p class="hint">Под условие сейчас подходит вилок в ленте: <b style="color:var(--text)">'+ruleCount(d)+'</b></p>'+
   (isNew?'':'<div class="grp" style="margin-top:14px"><button class="li" data-del="1" style="color:var(--down);justify-content:center">Удалить условие</button></div>');}
  draw();
  el.addEventListener('click',function(e){var c=e.target.closest('[data-sp]'),m=e.target.closest('[data-min]'),u=e.target.closest('[data-dur]');
    if(c){var i=d.sp.indexOf(c.dataset.sp);if(i>=0){if(d.sp.length>1)d.sp.splice(i,1)}else d.sp.push(c.dataset.sp)}
    if(m)d.min=+m.dataset.min; if(u)d.dur=+u.dataset.dur;
    if(c||m||u){hap('sel');draw()}
    if(e.target.closest('[data-del]')){popup('Удалить условие?','«'+(d.name||'без названия')+'»',[{id:'del',type:'destructive',text:'Удалить'},{type:'cancel'}],function(b){if(b==='del'){RULES=RULES.filter(function(x){return x.id!==d.id});save('rules',RULES);closeSheet();renderSig();renderTabs()}})}
  });
  sheetMain(isNew?'Добавить условие':'Сохранить',function(){d.name=($('#rn').value||'').trim()||d.sp.map(function(s){return SPN[s]}).join(', ')+' от '+d.min+'%';
    if(isNew)RULES.push(d);else RULES=RULES.map(function(x){return x.id===d.id?d:x});save('rules',RULES);hap('ok');closeSheet();renderSig();renderTabs();toast(isNew?'Условие добавлено':'Сохранено')});
}
